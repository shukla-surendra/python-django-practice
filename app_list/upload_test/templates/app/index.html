<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
</head>
<body>

  
<div class="container">
  <div class="row">
    <div class="col-sm-4">
     &nbsp;
    </div>
    <div class="col-sm-4">
    <form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="upload_name" multiple />
    <input type="file" name="upload_second_file" multiple/>
    <button type="submit" class="btn btn-default">Submit</button>
    </form>
    </div>
    <div class="col-sm-4">
    <h3>Ajax Form</h3>
    <form id="frm_ajax" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="upload_name" multiple />
    <input type="file" name="upload_second_file" multiple/>
    <input type="text" name="name[]"/>
    <input type="text" name="name[]"/>
    <button type="submit" class="btn btn-default">Submit</button>
    </form>
    </div>
  </div>
</div>
<script>
$(document).on("submit", "#frm_ajax", function(e){
  e.preventDefault();
  data = new FormData(this)
  $.ajax({url:'',type:'POST', data:data,processData:false,success:function(res, status, xHr){console.log(res)}})

})

</script>

</body>
</html>
